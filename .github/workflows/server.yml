name: Server
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, test and export Server image
        run: bash bin/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-image-${{ github.sha }}
          path: ${{ runner.temp }}/server-image/
          if-no-files-found: error
          retention-days: 7

  publish-image:
    needs: qualify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-image-${{ github.sha }}
          path: ${{ runner.temp }}/server-image/
      - name: Load the qualified Server image
        id: product
        shell: bash
        working-directory: ${{ runner.temp }}/server-image
        run: |
          sha256sum --check --strict SHA256SUMS
          image_id=$(cat image-id)
          [[ $image_id =~ ^sha256:[0-9a-f]{64}$ ]]
          docker load --input server-image.tar.gz
          echo "id=$image_id" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the qualified Server image to GHCR
        shell: bash
        env:
          PRODUCT_IMAGE_ID: ${{ steps.product.outputs.id }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$PRODUCT_IMAGE_ID" "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker tag "$PRODUCT_IMAGE_ID" "$image:latest"
          docker push "$image:latest"
